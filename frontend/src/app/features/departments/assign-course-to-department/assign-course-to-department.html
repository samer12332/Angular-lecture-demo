<div class="row justify-content-center">
  <div class="col-12 col-lg-8">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h3 class="mb-0">Assign Course To Department</h3>
      </div>

      <div class="card-body">
        @if (successMessage()) {
          <div class="alert alert-success">{{ successMessage() }}</div>
        }

        @if (errorMessage()) {
          <div class="alert alert-danger">{{ errorMessage() }}</div>
        }

        @if (isLoading() && !departments().length && !courses().length) {
          <div class="alert alert-secondary mb-0">Loading departments and courses...</div>
        } @else {
          <div class="mb-3">
            <label for="departmentId" class="form-label fw-semibold">
              Select Department
            </label>
            <select
              id="departmentId"
              class="form-select"
              [ngModel]="selectedDepartmentId()"
              (ngModelChange)="selectedDepartmentId.set($event)"
            >
              <option value="">Choose a department</option>

              @for (department of departments(); track department._id) {
                <option [value]="department._id">{{ department.name }}</option>
              }
            </select>
          </div>

          <div class="mb-4">
            <label for="courseId" class="form-label fw-semibold">
              Select Course
            </label>
            <select
              id="courseId"
              class="form-select"
              [ngModel]="selectedCourseId()"
              (ngModelChange)="selectedCourseId.set($event)"
            >
              <option value="">Choose a course</option>

              @for (course of courses(); track course._id) {
                <option [value]="course._id">
                  {{ course.name }} ({{ course.code }})
                </option>
              }
            </select>
          </div>

          <div class="d-flex flex-wrap gap-2">
            <button
              type="button"
              class="btn btn-primary"
              (click)="assignCourse()"
              [disabled]="isLoading()"
            >
              Assign
            </button>

            <a routerLink="/departments" class="btn btn-outline-secondary">Back</a>
          </div>
        }
      </div>
    </div>
  </div>
</div>
