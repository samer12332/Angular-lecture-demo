<div class="card shadow-sm">
  <div class="card-header bg-warning">
    <h3 class="mb-0">Update Department</h3>
  </div>

  <div class="card-body">
    @if (isLoading()) {
      <div class="alert alert-secondary mb-0">Loading department...</div>
    } @else if (department(); as currentDepartment) {
      @if (errorMessage()) {
        <div class="alert alert-danger">{{ errorMessage() }}</div>
      }

      <form (ngSubmit)="updateDepartment()">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input
            id="name"
            name="name"
            type="text"
            class="form-control"
            [ngModel]="currentDepartment.name"
            (ngModelChange)="updateDepartmentName($event)"
            required
          />
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea
            id="description"
            name="description"
            rows="4"
            class="form-control"
            [ngModel]="currentDepartment.description || ''"
            (ngModelChange)="updateDepartmentDescription($event)"
          ></textarea>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-warning">Update Department</button>
          <a routerLink="/departments" class="btn btn-secondary">Back</a>
        </div>
      </form>
    } @else {
      <div class="alert alert-warning mb-0">{{ errorMessage() }}</div>
    }
  </div>
</div>
