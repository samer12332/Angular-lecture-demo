<div class="card shadow-sm">
  <div class="card-header bg-info text-white">
    <h3 class="mb-0">Course Details</h3>
  </div>

  <div class="card-body">
    @if (isLoading()) {
      <div class="alert alert-secondary mb-0">Loading course details...</div>
    } @else if (course(); as currentCourse) {
      <p><strong>Name:</strong> {{ currentCourse.name }}</p>
      <p><strong>Code:</strong> {{ currentCourse.code }}</p>
      <p><strong>Hours:</strong> {{ currentCourse.hours }}</p>

      <a routerLink="/courses" class="btn btn-secondary">Back</a>
    } @else {
      <div class="alert alert-warning mb-0">{{ errorMessage() }}</div>
    }
  </div>
</div>
