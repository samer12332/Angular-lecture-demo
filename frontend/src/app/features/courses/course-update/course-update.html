<div class="card shadow-sm">
  <div class="card-header bg-warning">
    <h3 class="mb-0">Update Course</h3>
  </div>

  <div class="card-body">
    @if (isLoading()) {
      <div class="alert alert-secondary mb-0">Loading course...</div>
    } @else if (course(); as currentCourse) {
      @if (errorMessage()) {
        <div class="alert alert-danger">{{ errorMessage() }}</div>
      }

      <form (ngSubmit)="updateCourse()">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input
            id="name"
            name="name"
            type="text"
            class="form-control"
            [ngModel]="currentCourse.name"
            (ngModelChange)="updateCourseName($event)"
            required
          />
        </div>

        <div class="mb-3">
          <label for="code" class="form-label">Code</label>
          <input
            id="code"
            name="code"
            type="text"
            class="form-control"
            [ngModel]="currentCourse.code"
            (ngModelChange)="updateCourseCode($event)"
            required
          />
        </div>

        <div class="mb-3">
          <label for="hours" class="form-label">Hours</label>
          <input
            id="hours"
            name="hours"
            type="number"
            class="form-control"
            [ngModel]="currentCourse.hours"
            (ngModelChange)="updateCourseHours($event)"
            required
            min="1"
          />
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-warning">Update Course</button>
          <a routerLink="/courses" class="btn btn-secondary">Back</a>
        </div>
      </form>
    } @else {
      <div class="alert alert-warning mb-0">{{ errorMessage() }}</div>
    }
  </div>
</div>
