<div class="row justify-content-center">
  <div class="col-12 col-lg-8">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h3 class="mb-0">Update Degree</h3>
      </div>

      <div class="card-body">
        @if (isLoading()) {
          <div class="alert alert-secondary mb-0">Loading degree...</div>
        } @else if (errorMessage() && !degree()) {
          <div class="alert alert-danger mb-0">{{ errorMessage() }}</div>
        } @else if (degree()) {
          @if (errorMessage()) {
            <div class="alert alert-danger">{{ errorMessage() }}</div>
          }

          <div class="mb-3">
            <label class="form-label fw-semibold">Student</label>
            <input type="text" class="form-control" [value]="getStudentName()" readonly />
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Course</label>
            <input type="text" class="form-control" [value]="getCourseName()" readonly />
          </div>

          <div class="mb-4">
            <label for="degreeValue" class="form-label fw-semibold">Degree</label>
            <input
              id="degreeValue"
              type="number"
              class="form-control"
              min="0"
              max="100"
              [ngModel]="degreeValue()"
              (ngModelChange)="setDegreeValue($event)"
            />
          </div>

          <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-primary" (click)="updateDegree()">
              Save
            </button>

            <a routerLink="/degrees" class="btn btn-outline-secondary">Cancel</a>
          </div>
        }
      </div>
    </div>
  </div>
</div>
