<div class="card shadow-sm">
  <div class="card-header bg-primary text-white">
    <h3 class="mb-0">Add Student</h3>
  </div>

  <div class="card-body">
    <div class="mb-3">
      <label class="form-label">Student Name</label>
      <input
        type="text"
        class="form-control"
        placeholder="Enter student name"
        [(ngModel)]="studentName"
      />
    </div>

    <div class="mb-3">
      <label class="form-label">Student Age</label>
      <input
        type="number"
        class="form-control"
        placeholder="Enter student age"
        [(ngModel)]="studentAge"
      />
    </div>

    <button class="btn btn-primary me-2" (click)="addStudent()">Add</button>

    <a routerLink="/students" class="btn btn-secondary"> Cancel </a>
  </div>
</div>
