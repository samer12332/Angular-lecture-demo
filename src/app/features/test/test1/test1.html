<h1>Welcome</h1>
<h1>{{ id() }} {{ name() }} {{ age() * 2 }}</h1>
<input [(ngModel)]="id" />
<input type="checkbox" [(ngModel)]="flag" />
<input [value]="x" [disabled]="!flag" />
<h1 [innerText]="name()"></h1>
<table>
  <tr>
    <td>id</td>
    <td>name</td>
  </tr>
  <tr>
    <td [attr.colspan]="y">xyz</td>
  </tr>
</table>
<button (click)="myfun(t1.value)">show</button>
<!-- t1 is a template reference variable -->
<input #t1 type="text" (keyup.enter)="updatey(t1.value)" /> {{ y }}
<br />

<input [(ngModel)]="z" />{{ z }}
